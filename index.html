<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello World Test App</title>
  <style>
    :root { --bg: #f5f7fa; --accent: #111; }
    html,body { height:100%; margin:0; background:var(--bg); font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color:var(--accent); transition: background 0.6s ease; }
    .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; }
    .card { text-align:center; padding:3rem; border-radius:12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); background: rgba(255,255,255,0.6); backdrop-filter: blur(4px); }
    h1 { font-size: clamp(2.5rem, 6vw, 4rem); margin:0 0 1.5rem; }
    button { padding:0.75rem 1.25rem; font-size:1rem; border: none; border-radius:8px; background:#111; color:#fff; cursor:pointer; transition: transform .08s ease, opacity .08s; }
    button:active{ transform: translateY(1px) scale(.998); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Hello World</h1>
      <button id="changeBtn">Change background</button>
    </div>
  </div>
  <script>
    function randomColor(){
      const h = Math.floor(Math.random()*360);
      const s = 60 + Math.floor(Math.random()*20);
      const l = 45 + Math.floor(Math.random()*15);
      return `hsl(${h}, ${s}%, ${l}%)`;
    }
    document.getElementById('changeBtn').addEventListener('click', ()=> {
      document.body.style.background = randomColor();
    });
  </script>
</body>
</html>
