<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CostGPT</title>
  <style>
    :root{--bg:#f3f6fb;--card:#ffffff;--accent:#3b82f6;--muted:#6b7280}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:Inter,Segoe UI,system-ui,-apple-system,Roboto,"Helvetica Neue",Arial}
    body{display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#eef2ff,#f8fafc);padding:24px}
    .container{width:720px;max-width:96vw;background:var(--card);padding:32px;border-radius:12px;box-shadow:0 8px 30px rgba(16,24,40,0.08);text-align:center}
    h1{margin:0 0 18px;font-size:48px;color:#0f172a;letter-spacing:-1px}
    .form{display:flex;gap:12px;align-items:flex-start}
    textarea{flex:1;min-height:120px;resize:vertical;padding:12px 14px;border-radius:8px;border:1px solid #e6edf3;font-size:16px}
    button{background:var(--accent);color:#fff;border:0;padding:12px 18px;border-radius:8px;font-size:16px;cursor:pointer}
    button:active{transform:translateY(1px)}
    .progress-wrap{margin-top:12px;text-align:left}
    .progress{height:12px;background:#e6eefc;border-radius:999px;overflow:hidden}
    .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#60a5fa);transition:width 240ms ease}
    .meta{margin-top:10px;color:var(--muted);font-size:14px}
    .result{margin-top:16px;font-weight:600;color:#0b1220;font-size:16px}
    .small{font-size:13px;color:var(--muted);margin-top:6px}
  </style>
</head>
<body>
  <div class="container">
    <h1>CostGPT</h1>
    <div class="form">
      <textarea id="prompt" placeholder="Type your prompt here..."></textarea>
      <button id="done">Done</button>
    </div>

    <div class="progress-wrap">
      <div class="progress" aria-hidden>
        <div class="bar" id="bar"></div>
      </div>
      <div class="meta" id="meta">0 words • 0% of 200-word soft limit</div>
      <div class="result" id="result" aria-live="polite"></div>
      <div class="small" id="assumptions">Assumptions: 0.001 L water/word, 0.000001 kWh/word, grid 475 gCO2/kWh. <a href="#" id="tweak">Adjust</a></div>
    </div>
  </div>

  <script>
    (function(){
      const textarea = document.getElementById('prompt');
      const button = document.getElementById('done');
      const bar = document.getElementById('bar');
      const meta = document.getElementById('meta');
      const result = document.getElementById('result');
      const assumptionsEl = document.getElementById('assumptions');
      const tweakLink = document.getElementById('tweak');

      const SOFT_LIMIT = 200;

      // Adjustable constants (change here or add UI to tweak)
      let LITERS_PER_WORD = 0.001;       // liters per word
      let KWH_PER_WORD = 1e-6;          // kWh per word
      let GRID_G_PER_KWH = 475;         // grams CO2 per kWh (grid intensity)

      function countWords(text){
        if(!text) return 0;
        const matches = text.trim().match(/\S+/g);
        return matches ? matches.length : 0;
      }

      function updateProgress(){
        const words = countWords(textarea.value);
        const pct = Math.min(100, Math.round((words / SOFT_LIMIT) * 100));
        bar.style.width = pct + '%';
        meta.textContent = `${words} word${words===1? '': 's'} • ${pct}% of ${SOFT_LIMIT}-word soft limit`;
      }

      function formatNumber(n, digits = 3){
        return Number(n).toLocaleString(undefined, {maximumFractionDigits:digits});
      }

      function computeAndShow(){
        const words = countWords(textarea.value);
        const liters = words * LITERS_PER_WORD;
        const milliliters = liters * 1000;

        const kwh = words * KWH_PER_WORD;
        const joules = kwh * 3.6e6;

        const co2g = kwh * GRID_G_PER_KWH;

        result.innerHTML = `\n+          ${words} word${words===1? '': 's'} —\n+          <div>Water: <strong>${formatNumber(liters)} L</strong> (${formatNumber(milliliters)} mL)</div>\n+          <div>Electricity: <strong>${formatNumber(kwh,6)} kWh</strong> (${formatNumber(joules,0)} J)</div>\n+          <div>CO₂: <strong>${formatNumber(co2g,6)} g</strong></div>`;
        updateProgress();
      }

      // Toggle a simple prompt to tweak constants inline
      tweakLink.addEventListener('click', function(e){
        e.preventDefault();
        const newLit = prompt('Liters per word', LITERS_PER_WORD);
        const newKwh = prompt('kWh per word', KWH_PER_WORD);
        const newGrid = prompt('gCO2 per kWh (grid)', GRID_G_PER_KWH);
        if(newLit !== null) LITERS_PER_WORD = Math.max(0, parseFloat(newLit) || LITERS_PER_WORD);
        if(newKwh !== null) KWH_PER_WORD = Math.max(0, parseFloat(newKwh) || KWH_PER_WORD);
        if(newGrid !== null) GRID_G_PER_KWH = Math.max(0, parseFloat(newGrid) || GRID_G_PER_KWH);
        assumptionsEl.textContent = `Assumptions: ${LITERS_PER_WORD} L water/word, ${KWH_PER_WORD} kWh/word, grid ${GRID_G_PER_KWH} gCO2/kWh.`;
      });

      button.addEventListener('click', computeAndShow);
      textarea.addEventListener('input', updateProgress);
      updateProgress();
    })();
  </script>
</body>
</html>
